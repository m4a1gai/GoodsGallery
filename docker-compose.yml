services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goodsgallery
      POSTGRES_PASSWORD: goodsgallery
      POSTGRES_DB: goodsgallery
    ports:
      - "5432:5432"
    volumes:
      - goodsgallery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodsgallery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goodsgallery_pgdata:
